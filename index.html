<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Advogados SP - Instagram e Sites</title>
<style>
  :root { --bg:#0b1220; --card:#151f33; --line:#243349; --txt:#e6edf7; --dim:#8fa3bf;
          --cyan:#38bdf8; --gold:#fbbf24; --green:#4ade80; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font-family:'Segoe UI',Roboto,Arial,sans-serif; }
  header { background:linear-gradient(120deg,#123a63,#0b5f6b 55%,#134e4a); padding:26px 22px; }
  header h1 { margin:0 0 5px; font-size:23px; letter-spacing:-.3px; }
  header p { margin:0; color:#a5d8f3; font-size:13px; }
  .wrap { max-width:1500px; margin:0 auto; padding:0 16px 44px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
           gap:11px; margin:18px 0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:11px; padding:13px 15px; }
  .card b { display:block; font-size:25px; color:var(--cyan); line-height:1.15; }
  .card span { font-size:10.5px; color:var(--dim); text-transform:uppercase; letter-spacing:.7px; }
  .bar { display:flex; gap:9px; flex-wrap:wrap; align-items:center;
         background:var(--card); border:1px solid var(--line); border-radius:11px; padding:12px; margin-bottom:14px; }
  input,select,button { background:#0e1729; border:1px solid #2e405c; color:var(--txt);
         padding:9px 11px; border-radius:7px; font-size:13px; font-family:inherit; }
  input { min-width:250px; flex:1 1 250px; }
  button { cursor:pointer; background:#1d4ed8; border-color:#2563eb; font-weight:600; }
  button:hover { background:#2563eb; }
  button.ghost { background:transparent; border-color:#2e405c; font-weight:400; }
  #cont { color:var(--dim); font-size:12.5px; margin-left:auto; }
  table { width:100%; border-collapse:collapse; background:var(--card); font-size:13px;
          border:1px solid var(--line); border-radius:11px; overflow:hidden; }
  th { background:#1d2b44; color:#dce8f7; text-align:left; padding:11px 9px; position:sticky; top:0; cursor:pointer; user-select:none; }
  th:hover { background:#27395a; }
  th::after { content:'\2195'; opacity:.35; margin-left:5px; font-size:10px; }
  th.asc::after { content:'\2191'; opacity:1; color:var(--cyan); }
  th.desc::after { content:'\2193'; opacity:1; color:var(--cyan); }
  td { padding:8px 9px; border-top:1px solid #1b2740; }
  tr:hover td { background:#1b2c4d; }
  .nome { font-weight:600; }
  .oab { color:var(--gold); font-variant-numeric:tabular-nums; }
  .cid { color:var(--dim); }
  .anos { text-align:center; color:var(--green); font-weight:600; }
  .sit { font-size:11.5px; }
  .ok { color:var(--green); } .off { color:#f87171; }
  a { color:var(--cyan); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .site { font-size:12px; }
  .tag { display:inline-block; background:#1e3a5f; color:#93c5fd; border-radius:4px;
         padding:1px 6px; font-size:11px; }
  .rowhide { display:none; }
  footer { color:var(--dim); font-size:12px; text-align:center; padding:18px 0 0; }
  @media(max-width:760px){ .site-col { display:none; } .cid-col { display:none; } }
</style>
</head>
<body>
<header>
  <h1>Painel de Advogados &mdash; S&atilde;o Paulo</h1>
  <p>Advogados com Instagram e site pr&oacute;prio &middot; n&ordm; OAB, estado, cidade e tempo de advocacia</p>
</header>

<div class="wrap">
  <div class="cards" id="cards"></div>

  <div class="bar">
    <input id="q" placeholder="Buscar por nome, OAB, cidade, Instagram, site ou situa&ccedil;&atilde;o...">
    <select id="cidade"><option value="">Todas as cidades</option></select>
    <select id="sit">
      <option value="">Toda situa&ccedil;&atilde;o</option>
      <option value="ativo">Somente ativos</option>
      <option value="inativo">Somente inativos</option>
    </select>
    <select id="ord">
      <option value="anos-desc">Mais anos de advocacia</option>
      <option value="anos-asc">Menos anos de advocacia</option>
      <option value="oab-asc">Menor n&ordm; OAB</option>
      <option value="nome">Nome (A-Z)</option>
    </select>
    <button id="csv">Baixar CSV</button>
    <button id="xlsx" class="ghost">Baixar Excel</button>
    <span id="cont"></span>
  </div>

  <table>
    <thead><tr>
      <th data-k="nome">Nome</th>
      <th data-k="oab">N&ordm; OAB</th>
      <th data-k="cidade" class="cid-col">Cidade</th>
      <th data-k="anos">Anos</th>
      <th data-k="sit">Situa&ccedil;&atilde;o</th>
      <th data-k="ig">Instagram</th>
      <th data-k="site" class="site-col">Site</th>
    </tr></thead>
    <tbody id="tb"></tbody>
  </table>

  <footer>Dados p&uacute;blicos &middot; CNA/OAB + diret&oacute;rio jur&iacute;dico + busca web &middot;
  <span id="stamp"></span></footer>
</div>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function card(v, l) { return `<div class="card"><b>${v}</b><span>${l}</span></div>`; }
$('#cards').innerHTML =
  card(STATS.total, 'Advogados') +
  card(STATS.ativos, 'Ativos') +

const cidSel = $('#cidade');
Object.entries(STATS.cidades).sort((a,b) => b[1]-a[1]).forEach(([c,n]) => {
  const o = document.createElement('option'); o.value = c; o.textContent = c + ' (' + n + ')';
  cidSel.appendChild(o);
});

function linha(d) {
  const ativo = /ativa e regular|^ativo/i.test(d.sit);
  return `<tr>
    <td class="nome">${esc(d.nome)}</td>
    <td class="oab">${esc(d.oab)}</td>
    <td class="cid cid-col">${esc(d.cidade)}</td>
    <td class="anos">${esc(d.anos)}</td>
    <td class="sit ${ativo?'ok':'off'}">${esc(d.sit)}</td>
    <td>${d.ig ? `<a href="${esc(d.igurl)}" target="_blank">@${esc(d.ig)}</a>` : '&mdash;'}</td>
    <td class="site site-col">${d.site ? `<a href="${esc(d.site)}" target="_blank">${esc(d.site.replace(/^https?:\/\//,'').replace(/\/$/,'').slice(0,44))}</a>` : '&mdash;'}</td>
  </tr>`;
}

$('#tb').innerHTML = DADOS.map(linha).join('');

let ordem = {k:'anos', dir:'desc'};
document.querySelectorAll('th').forEach(th => th.onclick = () => {
  const k = th.dataset.k;
  ordem = (ordem.k===k) ? {k, dir: ordem.dir==='desc'?'asc':'desc'} : {k, dir: (k==='nome'?'asc':'asc')};
  render();
});

function filtrar() {
  const q = $('#q').value.toLowerCase().trim();
  const cid = cidSel.value;
  const sit = $('#sit').value;
  let out = DADOS.filter(d => {
    if (cid && d.cidade !== cid) return false;
    if (sit === 'ativo' && !/ativa e regular|^ativo/i.test(d.sit)) return false;
    if (sit === 'inativo' && /ativa e regular|^ativo/i.test(d.sit)) return false;
    if (q) {
      const hay = (d.nome+' '+d.oab+' '+d.cidade+' '+d.ig+' '+d.site+' '+d.sit+' '+d.anos).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const dir = ordem.dir === 'asc' ? 1 : -1;
  out.sort((a,b) => {
    if (ordem.k === 'nome') return a.nome.localeCompare(b.nome,'pt-BR') * dir;
    if (ordem.k === 'anos') return ((+a.anos||0) - (+b.anos||0)) * dir;
    if (ordem.k === 'oab') return ((+a.oab||0) - (+b.oab||0)) * dir;
    return 0;
  });
  return out;
}

function render() {
  const out = filtrar();
  $('#tb').innerHTML = out.map(linha).join('');
  $('#cont').textContent = out.length + ' de ' + DADOS.length + ' attorneys';
  document.querySelectorAll('th').forEach(th => {
    th.classList.remove('asc','desc');
    if (th.dataset.k === ordem.k) th.classList.add(ordem.dir);
  });
}

['q','cidade','sit','ord'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener(id==='q'?'input':'change', render);
});

function download(nome, conteudo, tipo) {
  const blob = new Blob([conteudo], {type: tipo});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nome; a.click();
  URL.revokeObjectURL(a.href);
}

$('#csv').onclick = () => {
  const out = filtrar();
  const cols = ['nome','oab','uf','estado','anos','reg','sit','cidade','tel','zap','ig','igurl','site','src'];
  const cab = ['nome','numero_oab','uf','estado','anos_de_advocacia','data_registro','situacao',
               'cidade','telefone','whatsapp','instagram','instagram_url','website','url_diretorio'];
  const escCsv = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
  const linhas = [cab.join(';')].concat(out.map(d => cols.map(c => escCsv(d[c])).join(';')));
  download('advogados_sp.csv', '\ufeff' + linhas.join('\r\n'), 'text/csv;charset=utf-8');
};

$('#xlsx').onclick = () => {
  const out = filtrar();
  const cols = ['nome','oab','uf','estado','anos','reg','sit','cidade','tel','zap','ig','igurl','site','src'];
  const cab = ['nome','numero_oab','uf','estado','anos_de_advocacia','data_registro','situacao',
               'cidade','telefone','whatsapp','instagram','instagram_url','website','url_diretorio'];
  const rows = out.map(d => cols.map(c => d[c] ?? ''));
  const xml = '<?xml version="1.0"?><Workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:ss="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<Worksheet ss:Name="Advogados"><Table>' +
    '<Row>' + cab.map(c => '<Cell><Data ss:Type="String">' + c + '</Data></Cell>').join('') + '</Row>' +
    rows.map(r => '<Row>' + r.map(v => '<Cell><Data ss:Type="String">' + String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</Data></Cell>').join('') + '</Row>').join('') +
    '</Table></Worksheet></Workbook>';
  download('advogados_sp.xls', xml, 'application/vnd.ms-excel');
};

render();
